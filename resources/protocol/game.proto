syntax = "proto3";

package protocol;

option go_package = "./;protocol";

import "common.proto";

// ============================================
// 游戏逻辑协议
// ============================================

// ============================================
// 消息ID定义
// ============================================

// 系统消息 1-99
enum SystemMsgId {
  MSG_SYSTEM_INVALID = 0;
  MSG_SYSTEM_HEARTBEAT = 1;
  MSG_SYSTEM_PING = 2;
  MSG_SYSTEM_PONG = 3;
  MSG_SYSTEM_KICK = 4;
  MSG_SYSTEM_MAINTENANCE = 5;
  MSG_SYSTEM_TOKEN_VERIFY = 10;
  MSG_SYSTEM_TOKEN_VERIFY_RESPONSE = 11;
  MSG_SYSTEM_ACCOUNT_LOGIN_NOTIFY = 12;
}

// 玩家消息 200-299
enum PlayerMsgId {
  MSG_PLAYER_INVALID = 0;
  MSG_PLAYER_CREATE = 200;
  MSG_PLAYER_CREATE_RESPONSE = 201;
  MSG_PLAYER_ENTER_GAME = 202;
  MSG_PLAYER_ENTER_GAME_RESPONSE = 203;
  MSG_PLAYER_LEAVE_GAME = 204;
}

// 地图消息 1200-1299
enum MapMsgId {
  MSG_MAP_INVALID = 0;
  MSG_MAP_ENTER = 1200;
  MSG_MAP_ENTER_RESPONSE = 1201;
  MSG_MAP_LEAVE = 1202;
  MSG_MAP_LEAVE_RESPONSE = 1203;
  MSG_MAP_MOVE = 1204;
  MSG_MAP_MOVE_RESPONSE = 1205;
  MSG_MAP_ATTACK = 1206;
  MSG_MAP_ATTACK_RESPONSE = 1207;
  MSG_MAP_CROSS_ENTER = 1208;          // 进入跨服活动实例（可能落在别的 realm 的 MapServer 上）
  MSG_MAP_CROSS_ENTER_RESPONSE = 1209;
  MSG_MAP_ENTER_VIEW = 1220;
  MSG_MAP_LEAVE_VIEW = 1221;
  MSG_MAP_ENTITY_MOVE = 1222;
  MSG_MAP_ENTITY_ATTR = 1223;   // 实体属性(血量)变更广播
  MSG_MAP_ENTITY_DEATH = 1224;  // 实体死亡广播
  MSG_MAP_ENTITY_BUFF = 1225;   // 实体 buff 增删广播
}

// ============================================
// 基础消息结构
// ============================================

// 客户端到服务器的消息头
message ClientMessage {
  uint32 msg_id = 1;
  int64 player_id = 2;
  int64 session_id = 3;
  bytes data = 4;
  int64 timestamp = 5;
  string token = 6;
}

message AccountLoginNotify {
  uint64 session_id = 1;
  int64 account_id = 2;
  string account_name = 3;
}

// 服务器到客户端的消息头
message ServerMessage {
  uint32 msg_id = 1;
  int32 result = 2;
  string error_msg = 3;
  bytes data = 4;
  int64 timestamp = 5;
}

// 心跳请求
message HeartbeatRequest {
  int64 client_time = 1;
}

// 心跳响应
message HeartbeatResponse {
  int64 client_time = 1;
  int64 server_time = 2;
}

// ============================================
// 地图相关结构
// ============================================

// 进入地图请求
message ClientMapEnterRequest {
  int64 player_id = 1;
  int32 map_id = 2;
}

// 进入地图响应
message ClientMapEnterResponse {
  int32 result = 1;
  string error_msg = 2;
  int32 map_id = 3;
  Position pos = 4;
}

// 地图移动请求
message ClientMapMoveRequest {
  int64 player_id = 1;
  int32 map_id = 2;
  Position pos = 3;
}

// 地图移动响应
message ClientMapMoveResponse {
  int32 result = 1;
  Position pos = 2;
}

// 离开地图请求
message ClientMapLeaveRequest {
  int64 player_id = 1;
  int32 map_id = 2;
}

// 离开地图响应
message ClientMapLeaveResponse {
  int32 result = 1;
  string error_msg = 2;
}

// 进入跨服活动实例请求。activity_id 标识一场跨服活动（同一活动的所有 realm 玩家进同一张实例地图），
// map_config_id 是该活动用哪张地图配置。玩家可能被送到**别的 realm 的 MapServer** 上。
message ClientCrossEnterRequest {
  int64 player_id = 1;
  int64 activity_id = 2;
  int32 map_config_id = 3;
}

// 进入跨服活动实例响应。map_server_id/map_id 用于排查（客户端不据此路由，路由在服务端）。
message ClientCrossEnterResponse {
  int32 result = 1;
  string error_msg = 2;
  int64 activity_id = 3;
  int32 map_server_id = 4;
  int32 map_id = 5;
  Position pos = 6;
}

// 地图攻击请求
message ClientMapAttackRequest {
  int64 player_id = 1;
  int32 map_id = 2;
  int64 target_id = 3;
}

// 地图攻击响应
message ClientMapAttackResponse {
  int32 result = 1;
  int64 target_id = 2;
  int64 damage = 3;
  int64 target_hp = 4;
}

// 实体进入视野通知
message EntityEnterViewNotify {
  int64 entity_id = 1;
  Position pos = 2;
}

// 实体离开视野通知
message EntityLeaveViewNotify {
  int64 entity_id = 1;
}

// 实体移动通知
message EntityMoveNotify {
  int64 entity_id = 1;
  Position old_pos = 2;
  Position new_pos = 3;
}

// 实体属性(血量)变更通知——战斗结算后经 AOI 广播给视野内玩家
message EntityAttrNotify {
  int64 entity_id = 1;
  int64 cur_hp = 2;
  int64 max_hp = 3;
}

// 实体死亡通知——经 AOI 广播给视野内玩家
message EntityDeathNotify {
  int64 entity_id = 1;
  int64 killer_id = 2;
}

// 实体 buff 增删通知——经 AOI 广播给视野内玩家
message EntityBuffNotify {
  int64 entity_id = 1;
  int32 buff_id = 2;
  bool added = 3;        // true=获得, false=移除
  int64 remaining_ms = 4; // 剩余毫秒(获得时有效)
}
